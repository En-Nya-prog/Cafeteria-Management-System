databases:
  - name: ebd-inventory-db
    databaseName: ebd_inventory
    user: ebd_inventory
    plan: basic-1gb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: ebd-inventory
    runtime: node
    plan: standard
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/healthz
    disk:
      name: ebd-inventory-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: STAFF_MFA_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PRODUCTS_CSV_PATH
        value: /var/data/products.csv
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: APP_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EBD_ADMIN_EMAIL
        sync: false
      - key: EBD_ADMIN_PASSWORD
        sync: false
